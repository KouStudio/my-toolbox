<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b30"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>SORA TOOLBOX</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1627;color:#f2f6ff;font-family:system-ui,sans-serif}header{padding:22px 18px 12px;max-width:820px;margin:auto}h1{font-size:24px;margin:0}header p,.muted{color:#a9bbd1;font-size:13px;line-height:1.6}.wrap{max-width:820px;margin:auto;padding:0 16px 30px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:#1b2a40;border:1px solid #344a67;border-radius:18px;padding:19px 14px;text-align:left;color:white;min-height:128px;cursor:pointer}.tile:active{background:#2c4668}.emoji{font-size:30px;display:block;margin-bottom:10px}.name{font-size:15px;font-weight:700;display:block}.desc{font-size:12px;color:#b1c1d5;margin-top:5px;display:block;overflow-wrap:anywhere}.panel{background:#17253a;border:1px solid #344a67;border-radius:16px;padding:15px;margin-top:17px}.panel h2{font-size:17px;margin:0 0 10px}button,.pick{border:1px solid #526a89;background:#294361;color:white;border-radius:11px;padding:11px 14px;font-size:14px;cursor:pointer}.pick input{display:none}.danger{background:#533042}.actions{display:flex;flex-wrap:wrap;gap:8px}.note{color:#b1c1d5;font-size:12px;line-height:1.6}.toolhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#17253a;border-bottom:1px solid #344a67}.toolhead strong{font-size:15px}#viewer{display:none;position:fixed;inset:0;background:#101827;z-index:5;flex-direction:column}#frame{flex:1;width:100%;border:0;background:#101827}#status{min-height:20px}#install{display:none}#installed{font-size:12px;color:#b1c1d5}.empty{font-size:13px;color:#a9bbd1} .small{padding:8px 10px;font-size:12px}footer{padding:15px 0;color:#8fa3bb;font-size:12px}</style></head><body><div id="home"><header><h1>🧰 SORA TOOLBOX</h1><p>使いたいツールをタップするだけ。追加したHTMLツールもこの端末に保存できます。</p></header><main class="wrap"><div id="grid" class="grid"></div><section class="panel"><h2>ツールを追加</h2><p class="note">これまでに作った単一HTMLツールを選択すると、このブラウザの端末内データベースに保存します。追加後はファイルを探さず起動できます。</p><div class="actions"><label class="pick">＋ HTMLを登録<input id="import" type="file" accept=".html,.htm,text/html" multiple></label><button id="install">ホーム画面にインストール</button></div><p id="status" class="note" role="status"></p><p id="installed">ホーム画面への追加は、HTTPS配信したアプリをChromeで開いて行います。</p></section><section class="panel"><h2>登録済みツールの管理</h2><div id="manage" class="empty">追加ツールはまだありません。</div></section><footer>画像・HTMLは外部へ送信しません。追加したHTMLに外部通信コードが含まれていないかは登録前に確認してください。ブラウザのデータ消去で追加ツールは消える場合があります。</footer></main></div><div id="viewer"><div class="toolhead"><button id="back" class="small">← 一覧へ</button><strong id="tooltitle"></strong></div><iframe id="frame" title="ツール" sandbox="allow-scripts allow-downloads allow-forms allow-modals"></iframe></div><script>
'use strict';const $=id=>document.getElementById(id);const builtin={id:'builtin-mask',name:'ひみつマスク',description:'黒塗り・ぼかし・モザイク',emoji:'🔒',url:'himitsu-mask.html'};let custom=[],deferredPrompt=null;
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open('sora-toolbox-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('tools',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function allTools(){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('tools');const r=tx.objectStore('tools').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}async function putTool(t){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('tools','readwrite');tx.objectStore('tools').put(t);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}async function delTool(id){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('tools','readwrite');tx.objectStore('tools').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)})}
function card(t){const b=document.createElement('button');b.className='tile';const em=document.createElement('span');em.className='emoji';em.textContent=t.emoji||'🛠️';const name=document.createElement('span');name.className='name';name.textContent=t.name;const desc=document.createElement('span');desc.className='desc';desc.textContent=t.description||'登録したツール';b.append(em,name,desc);b.onclick=()=>launch(t);return b}
async function render(){custom=await allTools();$('grid').replaceChildren(card(builtin),...custom.map(card));const manage=$('manage');manage.replaceChildren();if(!custom.length){manage.textContent='追加ツールはまだありません。';return}for(const t of custom){const row=document.createElement('div');row.className='actions';row.style.cssText='align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #334861';const label=document.createElement('span');label.textContent=t.name;label.style.fontSize='13px';const btn=document.createElement('button');btn.className='small danger';btn.textContent='削除';btn.onclick=async()=>{if(confirm('「'+t.name+'」を削除しますか？')){await delTool(t.id);await render()}};row.append(label,btn);manage.append(row)}}
async function launch(t){$('tooltitle').textContent=t.name;$('home').hidden=true;$('viewer').style.display='flex';if(t.url){$('frame').src=t.url}else{$('frame').srcdoc=t.html}history.pushState({tool:true},'','#tool')}
function closeTool(){if($('viewer').style.display==='none')return;$('frame').removeAttribute('src');$('frame').removeAttribute('srcdoc');$('viewer').style.display='none';$('home').hidden=false}
$('back').onclick=()=>{if(location.hash==='#tool')history.back();else closeTool()};addEventListener('popstate',()=>closeTool());
$('import').onchange=async e=>{const files=[...e.target.files];let count=0;for(const f of files){if(!/\.html?$/i.test(f.name)||f.size>5*1024*1024){$('status').textContent='HTML以外、または5MBを超えるファイルは登録できません：'+f.name;continue}try{const html=await f.text();const title=(html.match(/<title[^>]*>([^<]*)<\/title>/i)||[])[1];const name=(title||f.name.replace(/\.html?$/i,'')).trim().slice(0,55);const id='tool-'+crypto.randomUUID();await putTool({id,name,description:'追加したHTMLツール',emoji:'🛠️',html});count++}catch(err){$('status').textContent='登録できませんでした：'+f.name+' '+err.message}}if(count)$('status').textContent=count+'個のツールを登録しました。';e.target.value='';await render()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').style.display='inline-block'});$('install').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('install').style.display='none'};addEventListener('appinstalled',()=>{$('installed').textContent='ホーム画面に追加されました。'});
if('serviceWorker'in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render().catch(err=>{$('status').textContent='端末内ストレージを使えません：'+err.message;$('grid').append(card(builtin))});
</script></body></html>
